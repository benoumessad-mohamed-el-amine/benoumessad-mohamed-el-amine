<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2027"/><stop offset="0.55" stop-color="#203a43"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff9c" stop-opacity="0.18"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0.35"/>
  </linearGradient>
</defs>
<style>
  .t{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
  .title{font-size:50px;font-weight:700;animation:fade 1.6s ease forwards .2s}
  .sub{font-size:20px;fill:#cfeee0;letter-spacing:3px;animation:fade 1.6s ease forwards 1s}
  @keyframes fade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
</style>
<rect width="1000" height="220" fill="url(#bg)"/>
<g>
  <path d="M0 170 Q250 120 500 170 T1000 170 T1500 170 T2000 170 V220 H0 Z" fill="url(#w1)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 185 Q250 150 500 185 T1000 185 T1500 185 T2000 185 V220 H0 Z" fill="#00ff9c" fill-opacity="0.25">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="6s" repeatCount="indefinite"/>
  </path>
</g>
<text class="t title" x="500" y="95">Mohamed El Amine</text>
<text class="t sub" x="500" y="135">CYBERSECURITY &amp; AI ENGINEER</text>
</svg>